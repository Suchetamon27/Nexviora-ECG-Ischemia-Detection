<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexviora Live ECG</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: 3fr 1fr; gap: 20px; }
        .panel { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        h2 { margin-top: 0; color: #94a3b8; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        canvas { width: 100%; height: 300px; background: #0b0f19; border-radius: 4px; }
        .vitals { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .vital-box { background: #0f172a; padding: 15px; border-radius: 6px; text-align: center; }
        .vital-val { font-size: 2rem; font-weight: bold; color: #38bdf8; }
        .vital-lbl { font-size: 0.8rem; color: #64748b; }
        
        .status-bar { display: flex; justify-content: space-between; margin-bottom: 20px; padding: 10px 20px; background: #1e293b; border-radius: 8px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .bg-green { background: #166534; color: #bbf7d0; }
        .bg-red { background: #991b1b; color: #fecaca; }
        .bg-yellow { background: #ca8a04; color: #fef08a; }

        #events { max-height: 400px; overflow-y: auto; }
        .event { padding: 10px; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        .event-time { color: #64748b; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="status-bar">
        <div>Status: <span id="conn-status" class="badge bg-yellow">CONNECTING</span></div>
        <div>Signal: <span id="sig-status" class="badge bg-green">WAITING</span></div>
    </div>
    
    <div class="grid">
        <div class="panel">
            <h2>Live ECG</h2>
            <canvas id="ecgChart"></canvas>
            
            <div class="vitals">
                <div class="vital-box"><div class="vital-val" id="val-hr">--</div><div class="vital-lbl">HR (BPM)</div></div>
                <div class="vital-box"><div class="vital-val" id="val-spo2">--</div><div class="vital-lbl">SpO2 (%)</div></div>
                <div class="vital-box"><div class="vital-val" id="val-motion">--</div><div class="vital-lbl">Motion (g)</div></div>
                <div class="vital-box"><div class="vital-val" id="val-pitch">--</div><div class="vital-lbl">Pitch (deg)</div></div>
            </div>
        </div>
        
        <div class="panel">
            <h2>Ischemia Detection & Events</h2>
            <div style="margin-bottom: 10px;">
                <button onclick="clearSession()" style="background: #334155; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Clear Session</button>
            </div>
            <div id="events"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('ecgChart');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        
        let ecgBuffer = new Array(2500).fill(0); // 10 seconds at 250Hz
        let ws;

        function connect() {
            ws = new WebSocket(`ws://${location.host}/ws/live`);
            
            ws.onopen = () => {
                document.getElementById('conn-status').className = 'badge bg-green';
                document.getElementById('conn-status').innerText = 'CONNECTED';
            };
            
            ws.onclose = () => {
                document.getElementById('conn-status').className = 'badge bg-red';
                document.getElementById('conn-status').innerText = 'DISCONNECTED';
                setTimeout(connect, 2000);
            };
            
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                
                if (data.type === 'ecg') {
                    // Update buffer
                    if (data.filtered_samples) {
                        ecgBuffer = ecgBuffer.concat(data.filtered_samples);
                        if (ecgBuffer.length > 2500) {
                            ecgBuffer = ecgBuffer.slice(ecgBuffer.length - 2500);
                        }
                    }
                    
                    // Update vitals
                    document.getElementById('val-hr').innerText = data.hr ? data.hr.toFixed(1) : '--';
                    document.getElementById('val-spo2').innerText = data.spo2 ? data.spo2.toFixed(1) : '--';
                    document.getElementById('val-motion').innerText = data.motion ? data.motion.toFixed(2) : '--';
                    document.getElementById('val-pitch').innerText = data.pitch ? data.pitch.toFixed(1) : '--';
                    
                    // Update signal status
                    const sigBadge = document.getElementById('sig-status');
                    sigBadge.innerText = data.signal_quality;
                    if (data.signal_quality === 'GOOD') sigBadge.className = 'badge bg-green';
                    else if (data.signal_quality === 'MOTION_CONTAMINATED') sigBadge.className = 'badge bg-yellow';
                    else sigBadge.className = 'badge bg-red';
                    
                    drawECG();
                } else if (data.type === 'ischemia_result') {
                    addEvent(data);
                }
            };
        }

        function drawECG() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#4ade80';
            ctx.lineWidth = 1.5;
            
            const slice = ecgBuffer;
            const step = canvas.width / slice.length;
            
            // Auto scale Y
            let min = Math.min(...slice);
            let max = Math.max(...slice);
            if (max === min) { max += 1; min -= 1; }
            const range = max - min;
            
            for (let i = 0; i < slice.length; i++) {
                const x = i * step;
                const y = canvas.height - ((slice[i] - min) / range) * canvas.height;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function addEvent(evt) {
            const eventsDiv = document.getElementById('events');
            const el = document.createElement('div');
            el.className = 'event';
            const is_warning = evt.ischemia_detected || evt.probability > 0.5;
            el.innerHTML = `
                <div class="event-time">${new Date().toLocaleTimeString()}</div>
                <strong style="color: ${is_warning ? '#fecaca' : '#bbf7d0'}">${evt.finding || (is_warning ? 'Warning' : 'Normal')}</strong><br/>
                Prob: ${(evt.probability || 0).toFixed(2)}
            `;
            eventsDiv.prepend(el);
            
            // Save to session storage
            const stored = JSON.parse(sessionStorage.getItem('events') || '[]');
            stored.unshift(evt);
            sessionStorage.setItem('events', JSON.stringify(stored.slice(0, 50)));
        }

        function restoreEvents() {
            const stored = JSON.parse(sessionStorage.getItem('events') || '[]');
            stored.reverse().forEach(evt => addEvent(evt));
        }

        function clearSession() {
            sessionStorage.removeItem('events');
            document.getElementById('events').innerHTML = '';
        }

        restoreEvents();
        connect();
    </script>
</body>
</html>
